<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Great Guest — Аналитика</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    :root {
      --gold:   #c9a96e;
      --gold2:  #e8c97e;
      --bg:     #0c0b09;
      --card:   #161410;
      --card2:  #1a1a16;
      --border: rgba(201,169,110,.12);
      --text:   #f0ebe0;
      --muted:  #6b6455;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 0;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(12,11,9,.9);
      backdrop-filter: blur(20px);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 18px; font-weight: 700; }
    .logo span { color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    select#restSelect {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 14px;
      padding: 8px 14px; outline: none; cursor: pointer;
      transition: border-color .2s;
    }
    select#restSelect:focus { border-color: var(--gold); }
    .panel-link {
      font-size: 13px; color: var(--muted); text-decoration: none;
      padding: 8px 14px; border: 1px solid var(--border); border-radius: 10px;
      transition: color .2s, border-color .2s;
    }
    .panel-link:hover { color: var(--gold); border-color: var(--gold); }

    /* ── Layout ── */
    main { padding: 28px 32px 60px; max-width: 1200px; margin: 0 auto; }

    /* ── KPI row ── */
    .kpi-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 24px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px; padding: 22px 20px;
      position: relative; overflow: hidden;
      transition: border-color .2s;
    }
    .kpi::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      opacity: 0; transition: opacity .3s;
    }
    .kpi:hover { border-color: rgba(201,169,110,.3); }
    .kpi:hover::before { opacity: 1; }
    .kpi-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
    .kpi-val { font-size: 36px; font-weight: 700; line-height: 1; color: var(--text); }
    .kpi-val.gold { color: var(--gold); }
    .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .kpi-icon { position: absolute; right: 18px; top: 18px; font-size: 24px; opacity: .4; }

    /* ── Grid 2-col ── */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid3 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }

    /* ── Chart card ── */
    .chart-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px;
    }
    .card-title {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em;
      margin-bottom: 20px;
    }
    .chart-wrap { position: relative; height: 220px; }

    /* ── Level distribution ── */
    .levels { display: flex; flex-direction: column; gap: 12px; }
    .level-row { display: flex; align-items: center; gap: 10px; }
    .level-emoji { font-size: 18px; width: 24px; flex-shrink: 0; }
    .level-name { font-size: 13px; width: 60px; flex-shrink: 0; color: var(--muted); }
    .level-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
    .level-bar { height: 100%; border-radius: 99px; transition: width 1s cubic-bezier(.16,1,.3,1); }
    .level-count { font-size: 13px; font-weight: 600; width: 28px; text-align: right; flex-shrink: 0; }

    /* ── Top guests table ── */
    .guests-table { width: 100%; border-collapse: collapse; }
    .guests-table th {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); text-align: left; padding: 0 12px 12px;
      border-bottom: 1px solid var(--border);
    }
    .guests-table td {
      padding: 12px; font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .guests-table tr:last-child td { border: none; }
    .guests-table tr:hover td { background: rgba(255,255,255,.02); }
    .rank { color: var(--muted); font-size: 12px; width: 28px; }
    .g-name { font-weight: 500; }
    .g-visits { font-weight: 600; color: var(--gold); text-align: right; }
    .g-last { color: var(--muted); font-size: 12px; text-align: right; }

    /* Badge inline */
    .bdg {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .bdg-b { background: #3d2e1a; color: #cd7f32; }
    .bdg-s { background: #1e2630; color: #a8b8c8; }
    .bdg-g { background: #2e2a10; color: #ffd700; }
    .bdg-p { background: #1e1e2e; color: #b8b8e8; }

    /* ── Recent visits ── */
    .visit-feed { display: flex; flex-direction: column; gap: 8px; }
    .vf-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--card2);
      border-radius: 10px; font-size: 13px;
    }
    .vf-name { flex: 1; font-weight: 500; }
    .vf-time { color: var(--muted); font-size: 12px; }

    /* ── Loading/empty states ── */
    .skeleton { background: linear-gradient(90deg, #1a1a16 25%, #222218 50%, #1a1a16 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .empty { color: var(--muted); text-align: center; padding: 32px; font-size: 14px; }

    /* ── Responsive ── */
    @media(max-width: 900px) {
      header { padding: 16px 20px; }
      main { padding: 20px 16px 48px; }
      .kpi-row { grid-template-columns: repeat(2, 1fr); }
      .grid2 { grid-template-columns: 1fr; }
      .grid3 { grid-template-columns: 1fr; }
      .panel-link { display: none; }
    }
    @media(max-width: 480px) {
      .kpi-row { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .kpi { padding: 16px; }
      .kpi-val { font-size: 28px; }
      .guests-table .g-last { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Great<span>Guest</span> <span style="color:var(--muted);font-weight:400;font-size:14px">/ Аналитика</span></div>
  <div class="header-right">
    <label for="restSelect" class="sr-only">Выбрать ресторан</label>
    <select id="restSelect"><option value="">Загрузка...</option></select>
    <a href="/restaurant.html" class="panel-link"><span aria-hidden="true">📷</span> Панель</a>
  </div>
</header>

<main>

  <!-- KPI row -->
  <div class="kpi-row">
    <div class="kpi">
      <div class="kpi-icon" aria-hidden="true">🍽</div>
      <div class="kpi-label">Визитов всего</div>
      <div class="kpi-val" id="kTotal">—</div>
      <div class="kpi-sub" id="kTotalSub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-icon" aria-hidden="true">📅</div>
      <div class="kpi-label">За 7 дней</div>
      <div class="kpi-val gold" id="kWeek">—</div>
      <div class="kpi-sub" id="kWeekSub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-icon" aria-hidden="true">👥</div>
      <div class="kpi-label">Гостей</div>
      <div class="kpi-val" id="kGuests">—</div>
      <div class="kpi-sub" id="kGuestsSub"></div>
    </div>
    <div class="kpi">
      <div class="kpi-icon" aria-hidden="true">⭐</div>
      <div class="kpi-label">Gold+ гостей</div>
      <div class="kpi-val gold" id="kGold">—</div>
      <div class="kpi-sub">15+ визитов</div>
    </div>
  </div>

  <!-- Chart + Levels -->
  <div class="grid3">
    <div class="chart-card">
      <h2 class="card-title">Визиты за 14 дней</h2>
      <div class="chart-wrap">
        <canvas id="visitsChart" aria-label="График визитов за последние 14 дней" role="img"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h2 class="card-title">Уровни гостей</h2>
      <div class="levels" id="levelsWrap">
        <div class="empty">Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- Top guests + Recent -->
  <div class="grid2">
    <div class="chart-card">
      <h2 class="card-title">Топ гостей</h2>
      <table class="guests-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Гость</th>
            <th>Уровень</th>
            <th style="text-align:right">Визитов</th>
            <th style="text-align:right">Последний</th>
          </tr>
        </thead>
        <tbody id="topGuests"><tr><td colspan="5" class="empty">Загрузка...</td></tr></tbody>
      </table>
    </div>
    <div class="chart-card">
      <h2 class="card-title">Последние визиты</h2>
      <div class="visit-feed" id="recentFeed">
        <div class="empty">Загрузка...</div>
      </div>
    </div>
  </div>

</main>

<script>
const SUPABASE_URL = 'https://wjlhaizrygeyeishbycp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbGhhaXpyeWdleWVpc2hieWNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODg3NTIsImV4cCI6MjA5NDg2NDc1Mn0.BtSP2YukFJD-0KoghZqyE-w66k6h_eo8wOjKokLfcps';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let chart = null;
let currentRestId = null;

// ── Bootstrap ──
async function init() {
  const { data: rests } = await db.from('restaurants').select('id, name').order('name');
  const sel = document.getElementById('restSelect');
  if (!rests?.length) { sel.innerHTML = '<option>Нет ресторанов</option>'; return; }
  sel.innerHTML = rests.map(r => `<option value="${r.id}">${r.name}</option>`).join('');

  // Pre-select from URL ?rest=id
  const urlRest = new URLSearchParams(location.search).get('rest');
  if (urlRest) sel.value = urlRest;

  sel.addEventListener('change', () => loadDashboard(sel.value));
  loadDashboard(sel.value);
}

// ── Load all data ──
async function loadDashboard(restId) {
  currentRestId = restId;
  if (!restId) return;
  history.replaceState(null, '', `?rest=${restId}`);

  // Parallel fetches
  const [visitsRes, recentRes] = await Promise.all([
    db.from('visits').select('visited_at, telegram_id').eq('restaurant_id', restId),
    db.from('visits')
      .select('visited_at, telegram_id, guests(first_name, last_name, visit_count)')
      .eq('restaurant_id', restId)
      .order('visited_at', { ascending: false })
      .limit(20),
  ]);

  const visits = visitsRes.data || [];
  const recent = recentRes.data || [];

  renderKPIs(visits, recent);
  renderChart(visits);
  renderLevels(recent);
  renderTopGuests(recent);
  renderRecentFeed(recent);
}

// ── KPIs ──
function renderKPIs(visits, recent) {
  const total = visits.length;
  const now = new Date();
  const weekAgo = new Date(now - 7 * 864e5);
  const todayStr = now.toISOString().slice(0,10);

  const week  = visits.filter(v => new Date(v.visited_at) >= weekAgo).length;
  const today = visits.filter(v => v.visited_at.slice(0,10) === todayStr).length;
  const uniqueGuests = new Set(visits.map(v => v.telegram_id)).size;

  // Gold+ guests (visit_count >= 15)
  const goldPlus = new Set(
    recent.filter(v => (v.guests?.visit_count || 0) >= 15).map(v => v.telegram_id)
  ).size;

  setText('kTotal', total);
  setText('kTotalSub', `Сегодня: ${today}`);
  setText('kWeek', week);
  setText('kWeekSub', `Ср. в день: ${(week / 7).toFixed(1)}`);
  setText('kGuests', uniqueGuests);
  setText('kGuestsSub', uniqueGuests > 0 ? `${(total / uniqueGuests).toFixed(1)} визитов/гость` : '');
  setText('kGold', goldPlus);
}

// ── Chart ──
function renderChart(visits) {
  const days = 14;
  const labels = [];
  const counts = {};

  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5);
    const key = d.toISOString().slice(0,10);
    labels.push(d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }));
    counts[key] = 0;
  }
  visits.forEach(v => {
    const k = v.visited_at.slice(0,10);
    if (k in counts) counts[k]++;
  });

  const data = Object.values(counts);

  if (chart) { chart.destroy(); chart = null; }

  chart = new Chart(document.getElementById('visitsChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: data.map((_, i) => i === data.length - 1 ? '#c9a96e' : 'rgba(201,169,110,.25)'),
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: '#1a1a16',
        borderColor: 'rgba(201,169,110,.2)',
        borderWidth: 1,
        titleColor: '#c9a96e',
        bodyColor: '#f0ebe0',
        callbacks: { title: items => items[0].label, label: item => `${item.raw} визитов` }
      }},
      scales: {
        x: { grid: { display: false }, ticks: { color: '#6b6455', font: { size: 10 }, maxRotation: 0 } },
        y: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#6b6455', font: { size: 11 }, stepSize: 1 }, beginAtZero: true }
      }
    }
  });
}

// ── Levels ──
function renderLevels(recent) {
  const guestMap = {};
  recent.forEach(v => {
    if (v.guests && !guestMap[v.telegram_id]) {
      guestMap[v.telegram_id] = v.guests.visit_count || 0;
    }
  });
  const counts = { bronze: 0, silver: 0, gold: 0, platinum: 0 };
  Object.values(guestMap).forEach(n => {
    if (n >= 30) counts.platinum++;
    else if (n >= 15) counts.gold++;
    else if (n >= 5)  counts.silver++;
    else              counts.bronze++;
  });

  const total = Object.values(counts).reduce((a,b) => a+b, 0) || 1;
  const levels = [
    { emoji: '💎', name: 'Platinum', count: counts.platinum, color: '#b8b8e8' },
    { emoji: '🥇', name: 'Gold',     count: counts.gold,     color: '#ffd700' },
    { emoji: '🥈', name: 'Silver',   count: counts.silver,   color: '#a8b8c8' },
    { emoji: '🥉', name: 'Bronze',   count: counts.bronze,   color: '#cd7f32' },
  ];

  document.getElementById('levelsWrap').innerHTML = levels.map(l => `
    <div class="level-row">
      <div class="level-emoji" aria-hidden="true">${l.emoji}</div>
      <div class="level-name">${l.name}</div>
      <div class="level-bar-wrap">
        <div class="level-bar" style="width:${Math.round(l.count/total*100)}%;background:${l.color}"></div>
      </div>
      <div class="level-count">${l.count}</div>
    </div>
  `).join('');
}

// ── Top guests ──
function renderTopGuests(recent) {
  // Aggregate by guest
  const map = {};
  recent.forEach(v => {
    if (!v.guests) return;
    const id = v.telegram_id;
    if (!map[id]) map[id] = { name: `${v.guests.first_name} ${v.guests.last_name || ''}`.trim(), visits: v.guests.visit_count, last: v.visited_at };
    if (v.visited_at > map[id].last) map[id].last = v.visited_at;
  });

  const sorted = Object.values(map).sort((a,b) => b.visits - a.visits).slice(0, 10);
  if (!sorted.length) { document.getElementById('topGuests').innerHTML = '<tr><td colspan="5" class="empty">Нет данных</td></tr>'; return; }

  document.getElementById('topGuests').innerHTML = sorted.map((g, i) => {
    const b = badgeHtml(g.visits);
    const date = new Date(g.last).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    return `<tr>
      <td class="rank">${i+1}</td>
      <td class="g-name">${g.name}</td>
      <td>${b}</td>
      <td class="g-visits">${g.visits}</td>
      <td class="g-last">${date}</td>
    </tr>`;
  }).join('');
}

// ── Recent feed ──
function renderRecentFeed(recent) {
  const items = recent.slice(0, 10);
  if (!items.length) { document.getElementById('recentFeed').innerHTML = '<div class="empty">Нет визитов</div>'; return; }

  document.getElementById('recentFeed').innerHTML = items.map(v => {
    const name = v.guests ? `${v.guests.first_name} ${v.guests.last_name || ''}`.trim() : '—';
    const time = timeAgo(v.visited_at);
    const b = badgeHtml(v.guests?.visit_count || 0);
    return `<div class="vf-item">
      <div class="vf-name">${name}</div>
      ${b}
      <div class="vf-time">${time}</div>
    </div>`;
  }).join('');
}

// ── Helpers ──
function badgeHtml(n) {
  if (n >= 30) return '<span class="bdg bdg-p"><span aria-hidden="true">💎</span> Platinum</span>';
  if (n >= 15) return '<span class="bdg bdg-g"><span aria-hidden="true">🥇</span> Gold</span>';
  if (n >= 5)  return '<span class="bdg bdg-s"><span aria-hidden="true">🥈</span> Silver</span>';
  return '<span class="bdg bdg-b"><span aria-hidden="true">🥉</span> Bronze</span>';
}

function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)   return 'только что';
  if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
  if (diff < 86400) return `${Math.floor(diff/3600)} ч назад`;
  return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

// ── Auto-refresh every 60s ──
init();
setInterval(() => { if (currentRestId) loadDashboard(currentRestId); }, 60000);
</script>
</body>
</html>
