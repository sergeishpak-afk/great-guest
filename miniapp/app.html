<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Great Guest</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a96e;
      --gold-light: #e8c97e;
      --bg: #0f0f0f;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--tg-theme-bg-color, var(--bg));
      color: var(--tg-theme-text-color, var(--text));
      min-height: 100vh;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app { display: none; padding: 24px 20px 48px; }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--gold); }
    .greeting { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* ── Status card ── */
    .status-card {
      background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .status-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
    }

    .status-emoji { font-size: 48px; margin-bottom: 8px; }
    .status-name { font-size: 24px; font-weight: 700; color: var(--gold); }
    .visit-count { font-size: 14px; color: var(--muted); margin-top: 4px; }

    .status-reward {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      background: rgba(201,169,110,.12);
      border: 1px solid rgba(201,169,110,.25);
      border-radius: 99px;
      font-size: 13px;
      color: var(--gold-light);
    }

    .progress-wrap { margin-top: 16px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 99px;
      transition: width .6s ease;
    }

    /* ── Section titles ── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* ── QR ── */
    .qr-section { margin-bottom: 20px; }
    .qr-btn {
      width: 100%;
      background: var(--gold);
      color: #0f0f0f;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .2s, transform .1s;
    }
    .qr-btn:active { transform: scale(.97); opacity: .85; }
    .qr-btn:disabled { opacity: .5; cursor: default; }

    .qr-display {
      display: none;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 12px;
    }
    .qr-display img { width: 200px; height: 200px; }
    .qr-hint { font-size: 12px; color: #666; margin-top: 8px; }

    /* ── Offers ── */
    .offers-section { margin-bottom: 20px; }

    .offer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .offer-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--gold), var(--gold-light));
    }

    .offer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .offer-restaurant {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
    }
    .offer-date {
      font-size: 11px;
      color: var(--muted);
    }
    .offer-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-line;
    }

    /* ── Visit history ── */
    .visits-section { margin-bottom: 20px; }
    .visit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .visit-restaurant { font-weight: 500; }
    .visit-date { color: var(--muted); font-size: 13px; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 14px;
    }

    #error {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #e88;
    }

    /* ── Partner card ── */
    .partner-card {
      display: none;
      background: linear-gradient(135deg, rgba(201,169,110,.08) 0%, rgba(201,169,110,.04) 100%);
      border: 1px solid rgba(201,169,110,.25);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: border-color .2s, transform .1s;
      text-decoration: none;
      color: inherit;
      display: none;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }
    .partner-card:hover { border-color: rgba(201,169,110,.5); }
    .partner-card:active { transform: scale(.98); }
    .partner-card-icon { font-size: 28px; flex-shrink: 0; }
    .partner-card-text { flex: 1; min-width: 0; }
    .partner-card-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .partner-card-sub { font-size: 12px; color: var(--muted); }
    .partner-card-arrow { color: var(--gold); font-size: 18px; flex-shrink: 0; }
  </style>
</head>
<body>

<div id="loading" role="status" aria-live="polite" aria-label="Загрузка">
  <div class="spinner" aria-hidden="true"></div>
  <div style="color:#888;font-size:14px">Загружаем...</div>
</div>

<div id="error" role="alert" aria-live="assertive">
  <div style="font-size:32px;margin-bottom:12px" aria-hidden="true">⚠️</div>
  <div id="error-msg">Что-то пошло не так</div>
</div>

<div id="app">
  <div class="header">
    <div class="logo">Great<span>Guest</span></div>
    <div class="greeting" id="greeting">Добро пожаловать</div>
  </div>

  <!-- Status card -->
  <div class="status-card" role="region" aria-label="Ваш статус">
    <div class="status-emoji" id="status-emoji" aria-hidden="true">🥉</div>
    <div class="status-name" id="status-name">Bronze</div>
    <div class="visit-count" id="visit-count">0 визитов</div>
    <div class="status-reward" id="status-reward"></div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label">
        <span id="progress-from"></span>
        <span id="progress-to"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"
          role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>
  </div>

  <!-- QR -->
  <div class="qr-section">
    <h2 class="section-title">Визит</h2>
    <button class="qr-btn" id="qr-btn" onclick="getQR()">
      <span aria-hidden="true">🎫</span> Получить QR для визита
    </button>
    <div class="qr-display" id="qr-display" role="img" aria-label="QR-код для визита">
      <img id="qr-img" src="" alt="QR-код для визита" />
      <div class="qr-hint">Покажи код администратору ресторана</div>
    </div>
  </div>

  <!-- Offers from restaurants -->
  <div class="offers-section" id="offers-section" style="display:none">
    <h2 class="section-title">Предложения для вас</h2>
    <div id="offers-list"></div>
  </div>

  <!-- Visit history -->
  <div class="visits-section">
    <h2 class="section-title">История визитов</h2>
    <div id="visits-list"><div class="empty">Визитов пока нет</div></div>
  </div>

  <!-- Partner panel shortcut (shown only if user is also an owner) -->
  <div id="partner-section" style="margin-bottom:20px"></div>
</div>

<script>
const SUPABASE_URL = 'https://wjlhaizrygeyeishbycp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbGhhaXpyeWdleWVpc2hieWNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODg3NTIsImV4cCI6MjA5NDg2NDc1Mn0.BtSP2YukFJD-0KoghZqyE-w66k6h_eo8wOjKokLfcps';

const db  = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const tg  = window.Telegram?.WebApp;

const LEVELS = [
  { name: 'Bronze',   emoji: '🥉', min: 0,  max: 4,        reward: 'Добро пожаловать в программу' },
  { name: 'Silver',   emoji: '🥈', min: 5,  max: 14,       reward: 'Скидка 5% + приоритетная бронь' },
  { name: 'Gold',     emoji: '🥇', min: 15, max: 29,       reward: 'Скидка 10% + комплимент от шефа' },
  { name: 'Platinum', emoji: '💎', min: 30, max: Infinity, reward: 'Скидка 15% + VIP-обслуживание' },
];

function getLevel(n)  { return [...LEVELS].reverse().find(l => n >= l.min) || LEVELS[0]; }
function getNext(n)   { return LEVELS.find(l => l.min > n); }

function declVisit(n) {
  if (n % 10 === 1 && n % 100 !== 11) return 'визит';
  if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return 'визита';
  return 'визитов';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display   = 'block';
  document.getElementById('error-msg').textContent = msg;
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  if (tg) tg.ready();

  const initData = tg?.initData || '';
  if (!initData) {
    showError('Открой приложение через @great_guest_bot в Telegram');
    return;
  }

  let res, payload;
  try {
    res     = await fetch('/api/webapp-init', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ initData }),
    });
    payload = await res.json();
  } catch(e) {
    showError('Сетевая ошибка: ' + e.message);
    return;
  }

  if (!res.ok || !payload.guest) {
    showError('Ошибка: ' + (payload?.error || res.status));
    return;
  }

  const { guest } = payload;

  document.getElementById('greeting').textContent = `Привет, ${guest.first_name}! 👋`;
  renderStatus(guest.visit_count);

  // Load history, offers, and partner role in parallel
  await Promise.all([
    renderHistory(guest.telegram_id),
    renderOffers(initData),
    checkPartnerRole(initData),
  ]);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display     = 'block';
}

// ── Status ────────────────────────────────────────────────────────────────────
function renderStatus(count) {
  const lvl  = getLevel(count);
  const next = getNext(count);

  document.getElementById('status-emoji').textContent  = lvl.emoji;
  document.getElementById('status-name').textContent   = lvl.name;
  document.getElementById('visit-count').textContent   = `${count} ${declVisit(count)}`;
  document.getElementById('status-reward').textContent = lvl.reward;

  if (next) {
    const span = next.min - lvl.min;
    const done = count - lvl.min;
    const pct  = Math.min(100, Math.round((done / span) * 100));
    document.getElementById('progress-from').textContent = `${lvl.emoji} ${lvl.name}`;
    document.getElementById('progress-to').textContent   = `${next.emoji} ${next.name}`;
    const fill = document.getElementById('progress-fill');
    fill.style.width = pct + '%';
    fill.setAttribute('aria-valuenow', pct);
  } else {
    document.getElementById('progress-wrap').style.display = 'none';
  }
}

// ── Offers ────────────────────────────────────────────────────────────────────
async function renderOffers(initData) {
  try {
    const res  = await fetch('/api/guest-offers', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ initData }),
    });
    const data = await res.json();
    const offers = data.offers || [];
    if (!offers.length) return;

    const section = document.getElementById('offers-section');
    const list    = document.getElementById('offers-list');
    section.style.display = 'block';

    list.innerHTML = offers.map(o => {
      const rname = o.restaurants?.name || 'Ресторан-партнёр';
      const date  = new Date(o.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      const text  = o.offer_text || '';
      return `
        <article class="offer-card">
          <div class="offer-header">
            <span class="offer-restaurant">🏪 ${escHtml(rname)}</span>
            <span class="offer-date">${date}</span>
          </div>
          <div class="offer-text">${escHtml(text)}</div>
        </article>`;
    }).join('');
  } catch {
    // Non-critical — silently skip if offers unavailable
  }
}

// ── History ───────────────────────────────────────────────────────────────────
async function renderHistory(telegramId) {
  const { data: visits } = await db
    .from('visits')
    .select('visited_at, restaurants(name)')
    .eq('telegram_id', telegramId)
    .order('visited_at', { ascending: false })
    .limit(10);

  const list = document.getElementById('visits-list');
  if (!visits?.length) {
    list.innerHTML = '<div class="empty">Визитов пока нет — получи QR и посети ресторан!</div>';
    return;
  }
  list.innerHTML = visits.map(v => {
    const date = new Date(v.visited_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    const name = v.restaurants?.name || 'Ресторан-партнёр';
    return `<div class="visit-item">
      <span class="visit-restaurant">🍽 ${escHtml(name)}</span>
      <span class="visit-date">${date}</span>
    </div>`;
  }).join('');
}

// ── Partner role check ────────────────────────────────────────────────────────
async function checkPartnerRole(initData) {
  try {
    const res  = await fetch('/api/restaurant-dashboard', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ initData }),
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.owner) return;

    const owner     = data.owner;
    const venues    = data.venues || [];
    const planNames = { trial: 'Старт', basic: 'Базовый', network: 'Сеть', empire: 'Империя' };
    const planLabel = planNames[owner.plan] || owner.plan;
    const vCount    = venues.length;
    const subLabel  = owner.is_active
      ? `${planLabel} · ${vCount} заведени${vCount === 1 ? 'е' : 'й'}`
      : 'Подписка истекла — нужна активация';

    const section = document.getElementById('partner-section');
    if (!section) return;
    section.innerHTML = `
      <h2 class="section-title">Вы также партнёр</h2>
      <a href="admin.html" style="
        display:flex;align-items:center;gap:14px;
        background:linear-gradient(135deg,rgba(201,169,110,.08),rgba(201,169,110,.04));
        border:1px solid rgba(201,169,110,.3);border-radius:16px;
        padding:16px 18px;text-decoration:none;color:inherit;
        transition:border-color .2s">
        <span style="font-size:28px">🏪</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700;margin-bottom:3px">Панель управления</div>
          <div style="font-size:12px;color:var(--muted)">${escHtml(subLabel)}</div>
        </div>
        <span style="color:var(--gold);font-size:18px">→</span>
      </a>`;
  } catch {
    // non-critical — silently skip
  }
}

// ── QR ────────────────────────────────────────────────────────────────────────
async function getQR() {
  if (!tg?.initData) return;
  const btn = document.getElementById('qr-btn');
  btn.disabled = true;
  btn.innerHTML = '<span aria-hidden="true">⏳</span> Создаём QR...';

  try {
    const res  = await fetch('/api/create-qr', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ initData: tg.initData }),
    });
    const data = await res.json();
    if (!res.ok || !data.visitUrl) {
      alert(data.error || 'Ошибка создания QR');
      btn.disabled = false;
      btn.innerHTML = '<span aria-hidden="true">🎫</span> Получить QR для визита';
      return;
    }
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.visitUrl)}&ecc=H`;
    document.getElementById('qr-img').src     = qrUrl;
    document.getElementById('qr-display').style.display = 'block';
    btn.innerHTML = '<span aria-hidden="true">✅</span> QR готов';
  } catch(e) {
    alert('Ошибка: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<span aria-hidden="true">🎫</span> Получить QR для визита';
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
