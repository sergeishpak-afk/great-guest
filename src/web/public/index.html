<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Great Guest — Панель ресторана</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
    }
    .logo { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .logo span { color: #c9a96e; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }

    label { display: block; font-size: 13px; color: #888; margin-bottom: 8px; }
    input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      color: #f0f0f0;
      font-size: 16px;
      padding: 14px 16px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #c9a96e; }
    button {
      width: 100%;
      margin-top: 16px;
      background: #c9a96e;
      color: #0f0f0f;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: default; }

    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 14px;
      display: none;
    }
    .result.success { background: #1a2e1a; border: 1px solid #2d5a2d; }
    .result.error   { background: #2e1a1a; border: 1px solid #5a2d2d; }

    .guest-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .guest-meta { color: #888; font-size: 14px; margin-bottom: 16px; }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .badge-bronze   { background: #3d2e1a; color: #cd7f32; }
    .badge-silver   { background: #1e2630; color: #a8b8c8; }
    .badge-gold     { background: #2e2a10; color: #ffd700; }
    .badge-platinum { background: #1e1e2e; color: #b8b8e8; }

    .confirm-btn {
      margin-top: 16px;
      background: #2d7a2d;
      color: #fff;
    }
    .error-msg { color: #e88; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Great<span>Guest</span></div>
    <div class="subtitle">Панель ресторана — регистрация визита</div>

    <label for="token">QR-код гостя</label>
    <input id="token" type="text" placeholder="Введите код или отсканируйте QR" autofocus />
    <button id="checkBtn" onclick="checkGuest()">Проверить гостя</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    let currentToken = null;

    async function checkGuest() {
      const token = document.getElementById('token').value.trim();
      if (!token) return;
      currentToken = token;

      const btn = document.getElementById('checkBtn');
      btn.disabled = true;
      btn.textContent = 'Загрузка...';

      try {
        const res = await fetch(`/api/guest-preview/${token}`);
        const data = await res.json();
        if (!res.ok) return showError(data.error || 'Ошибка');
        showGuest(data.guest);
      } catch {
        showError('Ошибка соединения');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Проверить гостя';
      }
    }

    async function confirmVisit() {
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = 'Подтверждаю...';

      try {
        const res = await fetch('/api/confirm-visit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: currentToken }),
        });
        const data = await res.json();
        if (!res.ok) return showError(data.error || 'Ошибка');
        showSuccess(data.guest);
      } catch {
        showError('Ошибка соединения');
      }
    }

    function getStatusBadge(visits) {
      if (visits >= 30) return { label: '💎 Platinum', cls: 'badge-platinum' };
      if (visits >= 15) return { label: '🥇 Gold',     cls: 'badge-gold' };
      if (visits >= 5)  return { label: '🥈 Silver',   cls: 'badge-silver' };
      return { label: '🥉 Bronze', cls: 'badge-bronze' };
    }

    function showGuest(guest) {
      const badge = getStatusBadge(guest.visit_count);
      const result = document.getElementById('result');
      result.className = 'result success';
      result.style.display = 'block';
      result.innerHTML = `
        <div class="guest-name">${guest.first_name} ${guest.last_name || ''}</div>
        <div class="guest-meta">Визитов: ${guest.visit_count}</div>
        <span class="badge ${badge.cls}">${badge.label}</span>
        <button class="confirm-btn" id="confirmBtn" onclick="confirmVisit()">✅ Подтвердить визит</button>
      `;
    }

    function showSuccess(guest) {
      const badge = getStatusBadge(guest.visits);
      const result = document.getElementById('result');
      result.innerHTML = `
        <div class="guest-name">✅ Визит записан!</div>
        <div class="guest-meta">${guest.name} — ${guest.visits} визитов</div>
        <span class="badge ${badge.cls}">${getStatusBadge(guest.visits).label}</span>
        <button onclick="reset()" style="margin-top:16px;background:#333;color:#fff">Следующий гость</button>
      `;
      document.getElementById('token').value = '';
    }

    function showError(msg) {
      const result = document.getElementById('result');
      result.className = 'result error';
      result.style.display = 'block';
      result.innerHTML = `<div class="error-msg">❌ ${msg}</div>`;
    }

    function reset() {
      document.getElementById('result').style.display = 'none';
      document.getElementById('token').value = '';
      document.getElementById('token').focus();
      currentToken = null;
    }

    // Enter key support
    document.getElementById('token').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkGuest();
    });
  </script>
</body>
</html>
